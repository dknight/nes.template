name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Configure
        run: ./configure

      - name: Clean
        run: make clean

      - name: Build
        run: make

      - name: Verify ROM
        run: |
          if [ ! -s builds/main.nes ]; then
            echo "Error: ROM was not generated or is empty."
            exit 1
          fi

          echo "ROM successfully generated."
          ls -lh builds/main.nes
